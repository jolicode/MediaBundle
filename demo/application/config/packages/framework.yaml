# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@wasm:
    framework:
        session:
            # The browser stops the service worker that runs PHP when it has
            # nothing to do, and its memory is gone: the sessions are kept in
            # IndexedDB. Keep in sync with data in ../../../wasm/public/sw.js
            save_path: /media-bundle-demo/sessions
