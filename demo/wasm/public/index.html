<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JoliMediaBundle, in your browser</title>
    <meta name="description" content="Try the JoliMediaBundle demo in your browser: its EasyAdmin, SonataAdmin and Sylius admins run in WebAssembly, and your uploads never leave your device.">
    <link rel="canonical" href="https://mediabundle.jolicode.com/demo/">
    <meta property="og:title" content="JoliMediaBundle, in your browser">
    <meta property="og:description" content="Try the JoliMediaBundle demo in your browser: its EasyAdmin, SonataAdmin and Sylius admins run in WebAssembly, and your uploads never leave your device.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mediabundle.jolicode.com/demo/">
    <meta property="og:site_name" content="JoliMediaBundle">
    <meta property="og:image" content="https://mediabundle.jolicode.com/assets/favicon.png">
    <meta property="og:image:alt" content="The JoliMediaBundle logo">
    <meta name="twitter:card" content="summary">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebPage",
            "name": "JoliMediaBundle, in your browser",
            "url": "https://mediabundle.jolicode.com/demo/",
            "description": "The demo application of JoliMediaBundle, compiled to WebAssembly: it runs in your browser and your uploads never leave your device.",
            "inLanguage": "en",
            "about": {
                "@type": "SoftwareSourceCode",
                "name": "JoliMediaBundle",
                "codeRepository": "https://github.com/jolicode/MediaBundle"
            }
        }
    </script>
    <style>
        :root {
            color-scheme: light dark;
            background: light-dark(#fff, #121318);
            color: light-dark(#1c1d23, #e2e3ea);
            font: 1rem/1.5 system-ui, sans-serif;
        }
        body {
            max-width: 46rem;
            margin: 0 auto;
            padding: 2rem 1.25rem;
        }
        #message {
            color: light-dark(#5e6272, #9a9eb0);
        }
    </style>
</head>
<body>
    <!-- What the browser shows until the service worker answers in its place,
         with the application. The 404 page of the website sends a link to a
         page of the demo here, in ?path=, when the browser does not have the
         service worker yet (castor pages:site) -->
    <h1>JoliMediaBundle</h1>
    <p>Symfony and gd run in your browser, compiled to WebAssembly: no server runs PHP. What you upload stays in your browser.</p>
    <p id="message">Downloading PHP and the application…</p>

    <script type="module">
        const message = document.getElementById('message');
        // The directory of this page
        const demo = new URL('./', document.baseURI).href;

        // What the service worker does not answer: a file of the website that
        // is missing. A reload would show this page again
        if (navigator.serviceWorker?.controller) {
            message.textContent = 'This page does not exist. ';
            message.append(Object.assign(document.createElement('a'), { href: demo, textContent: 'Open the demo.' }));
        } else {
            try {
                // Not a static import: the page would say nothing when it fails
                const { startServiceWorker } = await import('./build/php-web.mjs');
                await startServiceWorker();

                // The service worker answers now, with the application: the
                // browser shows this page until PHP starts
                const path = new URLSearchParams(location.search).get('path');
                const page = path ? new URL(path, location.origin).href : null;
                if (page?.startsWith(demo)) {
                    location.replace(page);
                } else {
                    location.reload();
                }
            } catch (error) {
                message.textContent = `The demo does not start. ${error.message}`;
                throw error;
            }
        }
    </script>
</body>
</html>
