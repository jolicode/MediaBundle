[project]
site_name = "JoliMediaBundle"
site_description = "JoliMediaBundle provides a set of tools to manage media files in Symfony applications."
site_url = "https://mediabundle.jolicode.com/"
repo_url = "https://github.com/jolicode/MediaBundle"
copyright = 'JoliMediaBundle is licensed under <a href="https://github.com/jolicode/MediaBundle/blob/main/LICENSE">MIT license</a>'
docs_dir = "var/input"
site_dir = "var/output"
exclude_docs = "_nav.md"
extra_javascript = [
  "assets/javascripts/joli-media-documentation.bundle.min.js",
]
extra_css = [
  "assets/stylesheets/joli-media-documentation.bundle.min.css",
]

[project.theme]
logo = "assets/favicon.png"
favicon = "assets/favicon.png"
language = "en"
custom_dir = "templates/overrides"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.integrate",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
scheme = "default"
primary = "white"
accent = "amber"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "amber"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "amber"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github-alt"
link = "https://github.com/jolicode/MediaBundle"

[project.markdown_extensions]
admonition = {}
attr_list = {}
"github-callouts" = {}
footnotes = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.use_pygments = false
pymdownx.highlight.default_lang = "php"
pymdownx.highlight.linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tabbed.slugify.object = "pymdownx.slugs.slugify"
pymdownx.tabbed.slugify.kwds.case = "lower"
tables = {}
toc.permalink = true

[project.plugins.search]

[project.plugins."literate-nav"]
nav_file = "_nav.md"
