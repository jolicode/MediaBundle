name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Check Coding Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup castor
        uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: 'ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and start the test infrastructure
        run: castor infra:build

      - name: Install dependencies
        run: castor backend:install

      - name: Install qa tools
        run: castor qa:install

      - name: PHP CS
        run: castor qa:cs --dry-run

      - name: PHPStan
        run: castor qa:phpstan

      - name: Twig linter
        run: castor qa:twig-cs --dry-run

      - name: Lint the documentation
        run: castor qa:doctor-rst --error-format=github

  doc:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup castor
        uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

      - name: Build the documentation
        run: castor doc:start

  tests:
    name: Run tests (PHP ${{ matrix.php-versions }}, EasyAdmin ${{ matrix.easyadmin-versions }})
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 15
      matrix:
        php-versions: ['8.3', '8.4', '8.5', '8.6']
        easyadmin-versions: ['5.*']
        include:
          # the latest 4.x, and the lowest and highest release of every EasyAdmin 5 theme
          # (4.x: legacy theme, 5.0-5.2: new theme, 5.3+: cascade layers)
          - php-versions: '8.5'
            easyadmin-versions: '4.29.*'
          - php-versions: '8.5'
            easyadmin-versions: '5.0.*'
          - php-versions: '8.5'
            easyadmin-versions: '5.2.*'
          - php-versions: '8.5'
            easyadmin-versions: '5.3.*'
    env:
      PHP_VERSION: ${{ matrix.php-versions }}
      EASYADMIN_VERSION: ${{ matrix.easyadmin-versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup castor
        uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: 'ghcr.io'
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and start the test infrastructure
        run: castor infra:build --php-version "${PHP_VERSION}"

      - name: Install dependencies
        run: castor backend:install --php-version "${PHP_VERSION}" --easy-admin-version "${EASYADMIN_VERSION}"

      - name: Run tests
        run: castor qa:phpunit --php-version "${PHP_VERSION}"
