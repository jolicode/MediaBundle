name: Pages

# Builds the documentation, and the demo of demo/wasm/ that it checks, then
# deploys them to GitHub Pages, the demo in demo/. Nothing is deployed if a
# build or the checks fail.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and the one in progress is not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  doc:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history dates the pages
          fetch-depth: 0

      - name: Setup castor
        uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

      - name: Build the documentation
        run: castor doc:start

      - name: Upload the documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc
          path: doc-website/var/output
          if-no-files-found: error

  demo:
    name: Build the demo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Symfony needs PHP 8.4 or later on the host too: assets:install
      - name: Setup PHP and castor
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: castor

      # The checks run on node, with fetch-files.mjs: the version it is made for
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The cache needs the docker-container driver of buildx…
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # …and the runtime token and URLs of GitHub Actions, that only actions get
      - name: Expose the runtime of GitHub Actions
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build
        run: castor demo:wasm:build --set '*.cache-from=type=gha,scope=demo-wasm' --set '*.cache-to=type=gha,scope=demo-wasm,mode=max,ignore-error=true'

      - name: Check
        run: castor demo:wasm:check

      - name: Upload the demo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo
          path: demo/wasm/public
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: [doc, demo]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup castor
        uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Download the documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: doc
          path: doc-website/var/output

      - name: Download the demo
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo
          path: demo/wasm/public

      # The base path is empty on a custom domain, /MediaBundle without one
      - name: Lay out the site
        run: castor pages:site --base-path="${BASE_PATH}/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc-website/var/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
